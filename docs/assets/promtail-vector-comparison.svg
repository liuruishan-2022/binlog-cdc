<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: NotoSansCJK-Regular; font-size: 58px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: NotoSansCJK-Regular; font-size: 28px; font-weight: 500; fill: #475569; }
      .section { font-family: NotoSansCJK-Regular; font-size: 28px; font-weight: 700; fill: #111827; }
      .body { font-family: NotoSansCJK-Regular; font-size: 22px; font-weight: 400; fill: #334155; }
      .small { font-family: NotoSansCJK-Regular; font-size: 18px; font-weight: 400; fill: #64748b; }
      .metric { font-family: NotoSansCJK-Regular; font-size: 36px; font-weight: 800; fill: #0f172a; }
      .label { font-family: NotoSansCJK-Regular; font-size: 20px; font-weight: 500; fill: #475569; }
      .chip { font-family: NotoSansCJK-Regular; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="120" fill="#dbeafe" opacity="0.55"/>
  <circle cx="170" cy="760" r="150" fill="#dcfce7" opacity="0.5"/>

  <text x="96" y="112" class="title">Promtail 与 Vector 日志采集对比</text>
  <text x="98" y="160" class="subtitle">生产新增链路推荐 Vector，基于真实 K8s 部署、本地采集配置与高流量生产数据</text>

  <rect x="96" y="215" width="395" height="330" rx="18" class="card"/>
  <rect x="126" y="245" width="112" height="34" rx="17" fill="#64748b"/>
  <text x="151" y="269" class="chip">存量</text>
  <text x="126" y="322" class="section">Promtail</text>
  <text x="126" y="370" class="body">• Loki 生态采集 Agent</text>
  <text x="126" y="408" class="body">• 现有主日志链路已验证</text>
  <text x="126" y="446" class="body">• 配置简单，迁移成本低</text>
  <text x="126" y="492" class="small">风险：已 EOL，multiline / regex</text>
  <text x="126" y="520" class="small">配置不当容易放大内存占用</text>

  <rect x="602" y="215" width="395" height="330" rx="18" class="card"/>
  <rect x="632" y="245" width="112" height="34" rx="17" fill="#059669"/>
  <text x="657" y="269" class="chip">推荐</text>
  <text x="632" y="322" class="section">Vector</text>
  <text x="632" y="370" class="body">• file source 写入 Loki</text>
  <text x="632" y="408" class="body">• OTLP metrics 暴露 Prometheus</text>
  <text x="632" y="446" class="body">• source → sink 模型清晰</text>
  <text x="632" y="492" class="small">新增链路优先，存量链路迁移时</text>
  <text x="632" y="520" class="small">需重新验证 label 和 checkpoint</text>

  <rect x="1108" y="215" width="395" height="330" rx="18" class="card"/>
  <rect x="1138" y="245" width="128" height="34" rx="17" fill="#2563eb"/>
  <text x="1165" y="269" class="chip">后端</text>
  <text x="1138" y="322" class="section">Loki 3.6.8</text>
  <text x="1138" y="370" class="body">• 接收 Vector 日志写入</text>
  <text x="1138" y="408" class="body">• Grafana 查询与告警</text>
  <text x="1138" y="446" class="body">• 高峰写入需配套限流调优</text>
  <text x="1138" y="492" class="small">地址格式：loki 的地址:端口</text>
  <text x="1138" y="520" class="small">/loki/api/v1/push</text>

  <line x1="508" y1="380" x2="582" y2="380" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1014" y1="380" x2="1088" y2="380" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="132" y="630" width="300" height="138" rx="18" class="card"/>
  <text x="162" y="685" class="metric">2 亿</text>
  <text x="162" y="730" class="label">生产服务中心日请求量</text>

  <rect x="478" y="630" width="300" height="138" rx="18" class="card"/>
  <text x="508" y="685" class="metric">70w/s</text>
  <text x="508" y="730" class="label">日志采集峰值</text>

  <rect x="824" y="630" width="300" height="138" rx="18" class="card"/>
  <text x="854" y="685" class="metric">140-150 亿</text>
  <text x="854" y="730" class="label">每日日志行数</text>

  <rect x="1170" y="630" width="300" height="138" rx="18" class="card"/>
  <text x="1200" y="685" class="metric">8m / 134Mi</text>
  <text x="1200" y="730" class="label">当前 logs/vector 实时总用量</text>

  <text x="96" y="838" class="small">结论：新增生产日志采集链路优先使用 Vector；Promtail 存量链路可维护，迁移需重新验证 label、checkpoint、限流与查询习惯。</text>
</svg>
